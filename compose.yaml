name: payda

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: payda_sharing
      POSTGRES_USER: payda
      POSTGRES_PASSWORD: payda_local
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - sharing_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payda -d payda_sharing"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  sharing_postgres_data: