name: Sharing Service CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    defaults:
      run:
        working-directory: sharing-service

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java 25
        uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: sharing-service/pom.xml

      - name: Build and run tests
        run: bash ./mvnw --batch-mode --no-transfer-progress verify